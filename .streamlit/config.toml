# No server.port here on purpose. Streamlit Community Cloud assigns the app
# its own port and proxies to it; pinning one in config.toml makes the app
# bind a port the platform is not watching, and the deployment reports
# "Error running app". Local launchers pass --server.port on the command line.
[server]
headless = true
# "none" left the hosted app serving code it had already pulled: Streamlit
# Cloud fetches the new commit and says "Updated app!", but with no watcher
# the running process keeps the modules it imported at boot, so a push only
# took effect after a manual reboot. "auto" costs a little memory and saves
# that step.
fileWatcherType = "auto"

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#FF3E93"
backgroundColor = "#FFFDFB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#181316"
font = "sans serif"
